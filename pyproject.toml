[project]
name = "dvdml"
version = "0.7.0"
description = "ML-driven PVT-variation-aware leakage estimation: PTM 22nm LP transistors, CMOS gates and an 8-bit parity checker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas==2.3.3",   # pinned: pandas 3.x binaries are blocked by Windows Smart App Control on one dev PC
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "joblib",
    "lightgbm",        # model comparison (scripts/04, src/dvdml/ml.py)
    "torch",           # training only (scripts/04, 05d); prediction of the saved models is pure numpy
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false        # scripts add src/ to sys.path themselves; no build step needed

[tool.pytest.ini_options]
testpaths = ["tests"]
