# Single source of truth for the assignment parameters (Team 26: PTM 22nm_LP, VDD = 1 V, 8-bit parity checker).
assignment:
  model_file: 22nm_LP.pm
  vdd_nom: 1.0            # V (assigned)
  vdd_tol: 0.10           # +/-10 %
  lmin: 22.0e-9           # m, = feature size
  ldiff: 44.0e-9          # m, as in the example netlist given with the assignment
  w_min_mult: 1           # W = 1 x Lmin ...
  w_max_mult: 8           # ... to 8 x Lmin
  temp_min: -40.0         # degC
  temp_max: 125.0
  process_tol: 0.10       # nominal +/-10 % for vth0, toxe, ndep, u0, xj
  process_params: [vth0, toxe, ndep, u0, xj]

spice:
  # Required by the assignment on EVERY netlist
  options: "gmin=1e-18 abstol=1e-18 reltol=1e-6 vntol=1e-9"
  # junction areas AD = AS = W x Ldiff. PD/PS intentionally omitted (see report Appendix B).
  add_junction_areas: true
  # ngspice executable; overridden by the NGSPICE_EXE environment variable
  exe: ngspice_con

data:
  n_samples: 10000
  seed: 20261105
  columns: [vdd, temp, w, vd, vs, vg, vb, vth0, toxe, ndep, u0, xj, id, ig, is, ib]

ml:
  i_floor: 1.0e-15        # A; below this the BSIM4/ngspice value is numerical noise (D-027). Must equal metrics.I_FLOOR
  split_seed: 20261105
  split_fractions: [0.70, 0.15, 0.15]   # train / validation / test
  min_resolved_frac: 0.05 # currents with fewer resolved samples are not scored in the comparison table
